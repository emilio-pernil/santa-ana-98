  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: contain;
    }

    .safe-top {
      padding-top: max(12px, var(--sat));
    }

    .safe-bottom {
      padding-bottom: max(10px, var(--sab));
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.2s ease-out forwards;

</head>
<body class="bg-stone-100 text-stone-900 dark:bg-granate-950 dark:text-stone-100 antialiased selection:bg-oro-500/25">

  <!-- Ventana modal emergente (edición de cuentas / partidas / formularios) -->

  <!-- Ventana emergente propia para visor PDF y envío por WhatsApp -->

      <div class="px-4 py-3 bg-granate-950 text-oro-200 border-b border-oro-500/35 flex items-center justify-between gap-2 flex-wrap">
        <div class="min-w-0">
          <p id="pdf-popup-title" class="font-extrabold text-xs sm:text-sm truncate">Visor PDF · Santa Ana-98</p>
          <p id="pdf-popup-subtitle" class="text-[10px] text-stone-300 truncate">Ventana emergente del visor de documentos</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="pdf-popup-whatsapp-btn" type="button" onclick="shareLastGeneratedPdfOnWhatsApp()" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow flex items-center gap-1">
            <span>WhatsApp</span>
          </button>
          <button id="pdf-popup-download-btn" type="button" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-oro-400 to-oro-500 text-granate-950 font-extrabold text-xs shadow">
            Descargar PDF
          </button>
          <button type="button" onclick="closePdfPopupWindow()" aria-label="Cerrar ventana PDF" class="p-2 rounded-xl bg-granate-800 hover:bg-granate-700 text-oro-200">

          </button>
        </div>

      <div id="pdf-popup-canvas-area" class="flex-1 overflow-y-auto p-3 sm:p-4 bg-stone-200/80 dark:bg-granate-900/70 flex flex-col items-center justify-center">
        <p class="text-xs text-stone-600 dark:text-stone-300 my-auto mx-auto">Cargando visor de PDF...</p>
      </div>
    </div>

  <script>
    // =========================================================================
    // CONSTANTES DE ALMACENAMIENTO LOCAL Y SUPABASE
    // =========================================================================
    const STORAGE_KEY = 'santa_ana_98_asociacion_v2_cache';
    const IDB_NAME = 'SantaAna98AsociacionV2DB';
    const IDB_STORE = 'estado_asociacion';

    const SYNC_CONFIG_STORAGE_KEY = 'santa_ana_98_asociacion_supabase_v2';

    const DEFAULT_SUPABASE_CONFIG = {
      url: 'https://mugmwwyiftfbkrjlxpam.supabase.co',
      anonKey: 'sb_publishable_Mxr7Qwi72F6Lbdom0bHxxA_Ej5eLX_R',
      table: 'asociacion_santa_ana_98_estado',
      rowId: 'asociacion_santa_ana_98_cuentas_v2'
    };

    function loadSupabaseConfig() {
      try {
        const raw = localStorage.getItem(SYNC_CONFIG_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            return {
              url: (parsed.url || DEFAULT_SUPABASE_CONFIG.url).trim(),
              anonKey: (parsed.anonKey || DEFAULT_SUPABASE_CONFIG.anonKey).trim(),
              table: (parsed.table || DEFAULT_SUPABASE_CONFIG.table).trim(),
              rowId: (parsed.rowId || DEFAULT_SUPABASE_CONFIG.rowId).trim(),
              autoSync: parsed.autoSync !== false
            };
          }
        }
      } catch (_) {}
      return { ...DEFAULT_SUPABASE_CONFIG, autoSync: true };
    }

    let SUPABASE_CONFIG = loadSupabaseConfig();
    let activePdfIframeUrl = null;
    let lastGeneratedPdfMeta = {
      filename: 'Santa-Ana-98-Documento.pdf',
      summaryText: 'Documento PDF generado · Asociación Santa Ana-98',
      downloadFn: null
    };

    function revokeActivePdfIframeUrl() {
      if (activePdfIframeUrl) {
        try { URL.revokeObjectURL(activePdfIframeUrl); } catch (_) {}
        activePdfIframeUrl = null;
      }
    }

    function openWhatsAppWithText(text) {
      const encoded = encodeURIComponent(String(text || ''));
      const appUrl = `whatsapp://send?text=${encoded}`;
      const webUrl = `https://wa.me/?text=${encoded}`;
      const isAndroid = /Android/i.test(navigator.userAgent || '');

      if (isAndroid) {
        // En WebIntoApp / Android WebView, whatsapp:// abre directamente la app instalada
        // sin pasar por la página web ni disparar descargas en el WebView
        const link = document.createElement('a');
        link.href = appUrl;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => {
          if (!document.hidden) {
            window.location.href = webUrl;
          }
        }, 1200);
        return;
      }

      window.location.href = appUrl;
      setTimeout(() => {
        if (!document.hidden) {
          window.open(webUrl, '_blank', 'noopener,noreferrer');
        }
      }, 900);
    }

    function shareLastGeneratedPdfOnWhatsApp() {
      if (!lastGeneratedPdfBlob) {
        showToast('Primero genera un PDF', 'error');
        return;
      }
      if (typeof lastGeneratedPdfMeta.downloadFn === 'function') {
        lastGeneratedPdfMeta.downloadFn();
      } else {
        downloadGeneratedPdf();
      }
      const msg = `${lastGeneratedPdfMeta.summaryText}\nArchivo PDF: ${lastGeneratedPdfMeta.filename}`;
      openWhatsAppWithText(msg);
      showToast('PDF descargado · Abriendo WhatsApp', 'success');
    }

    async function renderPdfPagesIntoContainer(blob, container) {
      // Intenta usar PDF.js si está disponible para renderizar páginas en <canvas> sin que
      // Android WebView dispare "Save as" ni bloquee blob: en <iframe>.
      // Si no está cargado PDF.js, cae de forma segura a <embed>/<object>/iframe.
      const pdfjsLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
      if (pdfjsLib && typeof pdfjsLib.getDocument === 'function') {
        try {
          if (pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          }
          const arrayBuffer = await blob.arrayBuffer();
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          const pdfDoc = await loadingTask.promise;

          const pagesWrapper = document.createElement('div');
          pagesWrapper.className = 'w-full flex flex-col items-center gap-3 py-1';

          const containerWidth = Math.max(280, (container.clientWidth || 640) - 24);
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = Math.min(2.2, Math.max(0.8, containerWidth / unscaledViewport.width));
            const viewport = page.getViewport({ scale });

            const pageCard = document.createElement('div');
            pageCard.className = 'w-full flex flex-col items-center bg-white rounded-xl shadow-md border border-stone-300 overflow-hidden p-1.5';

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = Math.floor(viewport.width * dpr);
            canvas.height = Math.floor(viewport.height * dpr);
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            canvas.style.display = 'block';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            await page.render({ canvasContext: ctx, viewport }).promise;

            pageCard.appendChild(canvas);
            pagesWrapper.appendChild(pageCard);
          }

          container.innerHTML = '';
          container.appendChild(pagesWrapper);
          return true;
        } catch (_) {}
      }
      return false;
    }

    async function openPdfInPopupWindow({ title, subtitle, blob, onDownload, filename, summaryText }) {
      lastGeneratedPdfBlob = blob;
      lastGeneratedPdfMeta = {
        filename: filename || 'Santa-Ana-98-Documento.pdf',
        summaryText: summaryText || title || 'Informe Asociación Santa Ana-98',
        downloadFn: typeof onDownload === 'function' ? onDownload : downloadGeneratedPdf
      };
      revokeActivePdfIframeUrl();

      const popup = document.getElementById('pdf-popup-window');
      const titleEl = document.getElementById('pdf-popup-title');
      const subEl = document.getElementById('pdf-popup-subtitle');
      const area = document.getElementById('pdf-popup-canvas-area');
      const dlBtn = document.getElementById('pdf-popup-download-btn');

      if (!popup || !area) return;

      if (titleEl) titleEl.textContent = title || 'Visor PDF · Santa Ana-98';
      if (subEl) subEl.textContent = subtitle || 'Visor de documento PDF';
      if (dlBtn) {
        dlBtn.onclick = typeof onDownload === 'function' ? onDownload : downloadGeneratedPdf;
      }

      popup.classList.remove('hidden');
      popup.classList.add('flex');

      area.innerHTML = `<p class="text-xs text-stone-600 dark:text-stone-300 my-auto mx-auto">Renderizando documento PDF...</p>`;

      const renderedWithPdfJs = await renderPdfPagesIntoContainer(blob, area);
      if (renderedWithPdfJs) return;

      const objectUrl = URL.createObjectURL(blob);
      activePdfIframeUrl = objectUrl;

      area.innerHTML = `
        <iframe
          src="${objectUrl}#view=FitH"
          title="${escapeHtml(title || 'Visor PDF')}"
          class="w-full h-full min-h-[65vh] rounded-2xl bg-white border border-stone-300 dark:border-granate-800 shadow-inner">
        </iframe>
      `;
    }

    function closePdfPopupWindow() {
      const popup = document.getElementById('pdf-popup-window');
      const area = document.getElementById('pdf-popup-canvas-area');
      if (popup) {
        popup.classList.add('hidden');
        popup.classList.remove('flex');
      }
      if (area) {
        area.innerHTML = `<p class="text-xs text-stone-600 dark:text-stone-300 my-auto mx-auto">Cargando visor de PDF...</p>`;
      }
      revokeActivePdfIframeUrl();
    }

    // =========================================================================
    // ESTADO INICIAL PARTIENDO DE CERO (SIN DATOS PRECARGADOS)
    // =========================================================================
    function createInitialState() {
      return {
        meta: {
          asociacion: 'Asociación Santa Ana-98',
          updatedAt: new Date().toISOString()
        },
        ui: {
          activeTab: 'cuentas',
          movGestionExpanded: true,
          movFiltersExpanded: true,
          reportFiltersExpanded: true,
          movFilterTipo: 'TODOS',
          movFilterDesde: '',
          movFilterHasta: '',
          movFilterCategoria: '',
          movFilterCuenta: '',
          movFilterTexto: '',
          reportDesde: '',
          reportHasta: '',
          prevPresupuestoActivo: 'TODAS',
          darkMode: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        },
        cuentas: [],
        movimientos: [],
        presupuestos: []
      };
    }

    let state = createInitialState();
    let lastGeneratedPdfBlob = null;

    // =========================================================================
    // UTILIDADES DE FORMATO Y NOTIFICACIÓN
    // =========================================================================
    function formatEur(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('es-ES', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' €';
    }

    function formatDateEs(dateStr) {
      const s = String(dateStr || '').trim();
      if (!s) return '';
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      return s;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg, variant = 'info') {
      const banner = document.getElementById('toast-banner');
      const inner = document.getElementById('toast-inner');
      const textEl = document.getElementById('toast-message');
      textEl.textContent = msg;

      inner.className = 'px-4 py-3 rounded-2xl shadow-xl border text-xs sm:text-sm font-semibold flex items-center justify-between gap-2 ' + (
        variant === 'error'
          ? 'bg-red-950 text-red-100 border-red-700'
          : variant === 'success'
          ? 'bg-emerald-950 text-emerald-100 border-emerald-600'
          : 'bg-granate-950 text-oro-200 border-oro-500/40'
      );

      banner.classList.remove('hidden');
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => banner.classList.add('hidden'), 3200);
    }

    // =========================================================================
    // CACHÉ LOCAL: LOCALSTORAGE + INDEXEDDB
    // =========================================================================
    function openIndexedDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB no disponible'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function writeIDB(payload) {
      try {
        const db = await openIndexedDB();
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(payload, STORAGE_KEY);
      } catch (_) {}
    }

    async function readIDB() {
      try {
        const db = await openIndexedDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (_) {
        return null;
      }
    }

    function persistLocalState(triggerCloudSync = true) {
      state.meta.updatedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {
        showToast('Aviso: espacio de LocalStorage limitado', 'error');
      }
      writeIDB(state);
      if (triggerCloudSync) {
        scheduleAutoPushToSupabase();
      }
    }

    async function hydrateLocalState() {
      let parsed = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) parsed = JSON.parse(raw);
      } catch (_) {}
      if (!parsed) {
        parsed = await readIDB();
      }
      if (parsed && typeof parsed === 'object') {
        const init = createInitialState();
        state = {
          ...init,
          ...parsed,
          meta: { ...init.meta, ...(parsed.meta || {}) },
          ui: {
            ...init.ui,
            ...(parsed.ui || {}),
            movGestionExpanded: parsed.ui?.movGestionExpanded !== false,
            movFiltersExpanded: parsed.ui?.movFiltersExpanded !== false,
            reportFiltersExpanded: parsed.ui?.reportFiltersExpanded !== false,
            prevPresupuestoActivo: (parsed.ui && parsed.ui.prevPresupuestoActivo) || 'TODAS',
            customPresupuestos: Array.isArray(parsed.ui?.customPresupuestos) ? parsed.ui.customPresupuestos : [],
            deletedPresupuestos: Array.isArray(parsed.ui?.deletedPresupuestos) ? parsed.ui.deletedPresupuestos : []
          },
          cuentas: Array.isArray(parsed.cuentas) ? parsed.cuentas : [],
          movimientos: Array.isArray(parsed.movimientos) ? parsed.movimientos : [],
          presupuestos: Array.isArray(parsed.presupuestos) ? parsed.presupuestos : []
        };
      }

      // Garantiza siempre los nuevos valores por defecto de Supabase si no se ha guardado una config personalizada
      try {
        const savedCfg = localStorage.getItem(SYNC_CONFIG_STORAGE_KEY);
        if (!savedCfg) {
          SUPABASE_CONFIG = { ...DEFAULT_SUPABASE_CONFIG, autoSync: true };
        }
      } catch (_) {}
      applyTheme();
    }

    // =========================================================================
    // SINCRONIZACIÓN CON SUPABASE (AUTOMÁTICA Y MANUAL)
    // =========================================================================
    let autoSyncTimer = null;

    function isAutoSyncEnabled() {
      return SUPABASE_CONFIG.autoSync !== false;
    }

    function scheduleAutoPushToSupabase() {
      if (!isAutoSyncEnabled() || !navigator.onLine) return;
      clearTimeout(autoSyncTimer);
      const statusEl = document.getElementById('sync-status-text');
      if (statusEl) statusEl.textContent = 'Sincronizando cambios en la nube...';
      autoSyncTimer = setTimeout(() => {
        pushToSupabase(true);
      }, 900);
    }

    function getSupabaseHeaders() {
      return {
        'apikey': SUPABASE_CONFIG.anonKey,
        'Authorization': 'Bearer ' + SUPABASE_CONFIG.anonKey,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      };
    }

    function formatSupabaseError(status, detailText = '') {
      let parsedMsg = detailText;
      try {
        const j = JSON.parse(detailText);
        parsedMsg = j.message || j.hint || j.details || detailText;
      } catch (_) {}
      if (status === 404 || /relation .* does not exist/i.test(parsedMsg)) {
        return `Falta crear la tabla "${SUPABASE_CONFIG.table}" en Supabase (ver SQL en el icono de engranaje)`;
      }
      if (status === 401 || status === 403 || /row-level security/i.test(parsedMsg)) {
        return `Permiso denegado / RLS en "${SUPABASE_CONFIG.table}" (revisa políticas SQL en el engranaje)`;
      }
      return `HTTP ${status}${parsedMsg ? ': ' + parsedMsg : ''}`;
    }

    async function pushToSupabase(silent = false) {
      const statusEl = document.getElementById('sync-status-text');
      const pushBtn = document.getElementById('btn-push-sync');

      if (pushBtn) pushBtn.disabled = true;
      if (statusEl) statusEl.textContent = 'Publicando en nube...';

      const baseUrl = SUPABASE_CONFIG.url.replace(/\/+$/, '');
      const table = encodeURIComponent(SUPABASE_CONFIG.table);
      const rowId = encodeURIComponent(SUPABASE_CONFIG.rowId);

      const payload = {
        estado: state,
        actualizado_en: new Date().toISOString()
      };

      try {
        const patchResp = await fetch(`${baseUrl}/rest/v1/${table}?id=eq.${rowId}`, {
          method: 'PATCH',
          headers: getSupabaseHeaders(),
          body: JSON.stringify(payload)
        });
        if (!patchResp.ok) {
          const errBody = await patchResp.text().catch(() => '');
          throw new Error(formatSupabaseError(patchResp.status, errBody));
        }

        const updatedRows = await patchResp.json();
        if (!Array.isArray(updatedRows) || updatedRows.length === 0) {
          const postResp = await fetch(`${baseUrl}/rest/v1/${table}`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify({
              id: SUPABASE_CONFIG.rowId,
              ...payload
            })
          });
          if (!postResp.ok) {
            const errBody = await postResp.text().catch(() => '');
            throw new Error(formatSupabaseError(postResp.status, errBody));
          }
        }

        const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        if (statusEl) statusEl.textContent = `Sincronizado en nube ✓ ${hora} (${SUPABASE_CONFIG.rowId})`;
        if (!silent) showToast('Todo sincronizado en Supabase (cuentas, movimientos y presupuestos)', 'success');
      } catch (err) {
        if (statusEl) statusEl.textContent = `Error nube: ${err.message}`;
        if (!silent) showToast(`Error al sincronizar: ${err.message}`, 'error');
      } finally {
        if (pushBtn) pushBtn.disabled = false;
      }
    }

    async function pullFromSupabase(silent = false) {
      const statusEl = document.getElementById('sync-status-text');
      const pullBtn = document.getElementById('btn-pull-sync');

      if (pullBtn) pullBtn.disabled = true;
      if (statusEl) statusEl.textContent = 'Sincronizando desde nube...';

      const baseUrl = SUPABASE_CONFIG.url.replace(/\/+$/, '');
      const table = encodeURIComponent(SUPABASE_CONFIG.table);
      const rowId = encodeURIComponent(SUPABASE_CONFIG.rowId);

      try {
        const resp = await fetch(`${baseUrl}/rest/v1/${table}?id=eq.${rowId}&select=id,estado,actualizado_en`, {
          method: 'GET',
          headers: getSupabaseHeaders()
        });
        if (!resp.ok) {
          const errBody = await resp.text().catch(() => '');
          throw new Error(formatSupabaseError(resp.status, errBody));
        }

        const rows = await resp.json();
        if (Array.isArray(rows) && rows.length > 0 && rows[0].estado) {
          const remote = rows[0].estado;
          const keepTab = state.ui.activeTab;
          const keepExpanded = state.ui.movGestionExpanded;
          const keepMovFiltersExp = state.ui.movFiltersExpanded;
          const keepRepFiltersExp = state.ui.reportFiltersExpanded;
          const keepFilter = state.ui.movFilterTipo;
          const keepDesde = state.ui.reportDesde;
          const keepHasta = state.ui.reportHasta;
          const keepPrevSel = state.ui.prevPresupuestoActivo;

          const init = createInitialState();
          state = {
            ...init,
            ...remote,
            meta: { ...init.meta, ...(remote.meta || {}) },
            ui: {
              ...init.ui,
              ...(remote.ui || {}),
              activeTab: keepTab,
              movGestionExpanded: keepExpanded !== undefined ? keepExpanded : (remote.ui?.movGestionExpanded !== false),
              movFiltersExpanded: keepMovFiltersExp !== undefined ? keepMovFiltersExp : (remote.ui?.movFiltersExpanded !== false),
              reportFiltersExpanded: keepRepFiltersExp !== undefined ? keepRepFiltersExp : (remote.ui?.reportFiltersExpanded !== false),
              movFilterTipo: keepFilter,
              movFilterDesde: state.ui.movFilterDesde || '',
              movFilterHasta: state.ui.movFilterHasta || '',
              movFilterCategoria: state.ui.movFilterCategoria || '',
              movFilterCuenta: state.ui.movFilterCuenta || '',
              movFilterTexto: state.ui.movFilterTexto || '',
              reportDesde: keepDesde,
              reportHasta: keepHasta,
              prevPresupuestoActivo: keepPrevSel || remote.ui?.prevPresupuestoActivo || 'TODAS'
            },
            cuentas: Array.isArray(remote.cuentas) ? remote.cuentas : [],
            movimientos: Array.isArray(remote.movimientos) ? remote.movimientos : [],
            presupuestos: Array.isArray(remote.presupuestos) ? remote.presupuestos : []
          };

          persistLocalState(false);
          applyTheme();
          render();
          const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          if (statusEl) statusEl.textContent = `Sincronizado ↓ ${hora} (${SUPABASE_CONFIG.rowId})`;
          if (!silent) showToast('Datos descargados y sincronizados desde Supabase', 'success');
        } else {
          const hasLocalData = state.cuentas.length > 0 || state.movimientos.length > 0 || state.presupuestos.length > 0;
          if (hasLocalData && isAutoSyncEnabled()) {
            await pushToSupabase(true);
          } else {
            if (statusEl) statusEl.textContent = `Nube conectada · Lista para sincronizar`;
            if (!silent) showToast('Conexión correcta · Aún no había datos remotos');
          }
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = `Sin conexión nube (${err.message})`;
        if (!silent) showToast(`Error al sincronizar: ${err.message}`, 'error');
      } finally {
        if (pullBtn) pullBtn.disabled = false;
      }
    }

    function getSupabaseSetupSql(tableName = SUPABASE_CONFIG.table) {
      const safeTable = String(tableName || 'asociacion_santa_ana_98_estado').replace(/[^a-zA-Z0-9_]/g, '') || 'asociacion_santa_ana_98_estado';
      return `create table if not exists public.${safeTable} (
  id text primary key,
  estado jsonb not null default '{}'::jsonb,
  actualizado_en timestamptz not null default now()
);

alter table public.${safeTable} enable row level security;

drop policy if exists "Acceso asociacion santa ana 98 ${safeTable}" on public.${safeTable};
create policy "Acceso asociacion santa ana 98 ${safeTable}"
  on public.${safeTable}
  for all
  to anon, authenticated
  using (true)
  with check (true);`;
    }

      const a = document.createElement('a');
      a.href = url;
      a.download = `Santa-Ana-98-Copia-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

    function importBackupJson(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          const incoming = parsed && parsed.state && typeof parsed.state === 'object' ? parsed.state : parsed;
          if (!incoming || typeof incoming !== 'object' || (!Array.isArray(incoming.cuentas) && !Array.isArray(incoming.movimientos) && !Array.isArray(incoming.presupuestos))) {
            throw new Error('Estructura JSON no válida');
          }
          const init = createInitialState();
          state = {
            ...init,
            ...incoming,
            meta: { ...init.meta, ...(incoming.meta || {}) },
            ui: { ...init.ui, ...(incoming.ui || {}) },
            cuentas: Array.isArray(incoming.cuentas) ? incoming.cuentas : [],
            movimientos: Array.isArray(incoming.movimientos) ? incoming.movimientos : [],
            presupuestos: Array.isArray(incoming.presupuestos) ? incoming.presupuestos : []

          render();
          showToast('Copia JSON importada correctamente', 'success');

          showToast(`Error al importar JSON: ${err.message}`, 'error');

    // =========================================================================
    // CÁLCULOS CONTABLES Y DE CUENTAS
    // =========================================================================
    function getCuentaSaldo(cuenta) {
      const base = Number(cuenta.saldoInicial) || 0;
      const fechaCorte = (cuenta.fechaSaldo || '').trim();
      let delta = 0;
      for (const mov of state.movimientos) {
        if (mov.cuentaOrigen === cuenta.nombre) {
          if (fechaCorte && mov.fecha && mov.fecha <= fechaCorte) continue;
          const imp = Number(mov.importe) || 0;
          delta += mov.tipo === 'INGRESO' ? imp : -imp;
        }
      }
      return base + delta;
    }

    function getGlobalTotals() {
      const totalIngresos = state.movimientos
        .filter(m => m.tipo === 'INGRESO')
        .reduce((acc, m) => acc + (Number(m.importe) || 0), 0);
      const totalGastos = state.movimientos
        .filter(m => m.tipo === 'GASTO')
        .reduce((acc, m) => acc + (Number(m.importe) || 0), 0);
      const saldoCuentas = state.cuentas
        .reduce((acc, c) => acc + getCuentaSaldo(c), 0);
      const movsSinCuenta = state.movimientos
        .filter(m => !state.cuentas.some(c => c.nombre === m.cuentaOrigen))
        .reduce((acc, m) => acc + (m.tipo === 'INGRESO' ? (Number(m.importe) || 0) : -(Number(m.importe) || 0)), 0);
      const saldoTotal = saldoCuentas + movsSinCuenta;

      return { totalIngresos, totalGastos, saldoTotal };
    }

    function getFilteredReportMovimientos() {
      const desde = (state.ui.reportDesde || '').trim();
      const hasta = (state.ui.reportHasta || '').trim();
      return state.movimientos.filter(m => {
        if (!m.fecha) return true;
        if (desde && m.fecha < desde) return false;
        if (hasta && m.fecha > hasta) return false;
        return true;
      });
    }

      persistLocalState(false);
      render();
    }

    function toggleMovFiltersAccordion() {
      state.ui.movFiltersExpanded = state.ui.movFiltersExpanded === false ? true : false;
      persistLocalState(false);
      render();
    }

    function toggleReportFiltersAccordion() {
      state.ui.reportFiltersExpanded = state.ui.reportFiltersExpanded === false ? true : false;
      persistLocalState(false);
      render();
    }

    function getFilteredMovimientosList() {
      const filterTipo = state.ui.movFilterTipo || 'TODOS';
      const desde = (state.ui.movFilterDesde || '').trim();
      const hasta = (state.ui.movFilterHasta || '').trim();
      const cat = (state.ui.movFilterCategoria || '').trim().toLowerCase();
      const cta = (state.ui.movFilterCuenta || '').trim().toLowerCase();
      const texto = (state.ui.movFilterTexto || '').trim().toLowerCase();

      return state.movimientos.filter(m => {
        if (filterTipo === 'INGRESO' && m.tipo !== 'INGRESO') return false;
        if (filterTipo === 'GASTO' && m.tipo !== 'GASTO') return false;
        if (desde && m.fecha && m.fecha < desde) return false;
        if (hasta && m.fecha && m.fecha > hasta) return false;
        if (cat && String(m.categoria || '').toLowerCase() !== cat) return false;
        if (cta && String(m.cuentaOrigen || '').toLowerCase() !== cta) return false;
        if (texto) {
          const hay = [
            m.concepto,
            m.referencia,
            m.observaciones,
            m.categoria,
            m.cuentaOrigen,
            m.fecha, formatDateEs(m.fecha),
            String(m.importe || '')
          ].join(' ').toLowerCase();
          if (!hay.includes(texto)) return false;
        }
        return true;
      });
    }

    function normalizeCategoriaInput(rawCat, tipo = '') {
      const s = String(rawCat || '').trim();
      if (!s) return '';
      if (CODIGO_CATEGORIA_MAP[s]) return CODIGO_CATEGORIA_MAP[s];
      const all = [...CATEGORIAS_POR_TIPO.INGRESO, ...CATEGORIAS_POR_TIPO.GASTO];
      const found = all.find(c => c.toLowerCase() === s.toLowerCase());
      if (found) return found;
      if (tipo && CATEGORIAS_POR_TIPO[tipo]) {
        const foundByTipo = CATEGORIAS_POR_TIPO[tipo].find(c => c.toLowerCase() === s.toLowerCase());
        if (foundByTipo) return foundByTipo;
      }
      return s;
    }

      if (!tipo) {
        catEl.innerHTML = `<option value="">Selecciona primero el tipo...</option>`;
        return;
      }

      let optionsHtml = `<option value="">Selecciona categoría...</option>`;
      for (const c of cats) {
        const isSel = c.toLowerCase() === currentVal.toLowerCase();
        optionsHtml += `<option value="${escapeHtml(c)}" ${isSel ? 'selected' : ''}>${escapeHtml(c)}</option>`;

      if (currentVal && !cats.some(c => c.toLowerCase() === currentVal.toLowerCase())) {
        optionsHtml += `<option value="${escapeHtml(currentVal)}" selected>${escapeHtml(currentVal)}</option>`;
      }

      catEl.innerHTML = optionsHtml;

    // =========================================================================
    // IMPORTACIÓN DESDE ARCHIVO CSV O TEXTO PEGADO
    // =========================================================================
    function parseCsvDate(val) {
      const s = String(val || '').trim();
      if (!s || s.toUpperCase() === 'NULL') return new Date().toISOString().slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) {
        return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      }
      return s;
    }

    function parseCsvAmount(val) {
      let s = String(val || '').trim().replace(/€/g, '').replace(/\s+/g, '');
      if (!s || s.toUpperCase() === 'NULL') return 0;
      if (s.includes(',') && s.includes('.')) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else if (s.includes(',')) {
        s = s.replace(',', '.');
      }
      const n = Number(s);
      return Number.isFinite(n) ? Math.abs(Math.round(n * 100) / 100) : 0;
    }

    function parseMovimientosFromCsv(rawText, defaultTipo = 'INGRESO') {
      const lines = String(rawText || '')
        .split(/\r\n|\r|\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

      if (!lines.length) return [];

      const first = lines[0];
      const semiCount = (first.match(/;/g) || []).length;
      const commaCount = (first.match(/,/g) || []).length;
      const tabCount = (first.match(/\t/g) || []).length;
      let sep = ';';
      if (tabCount >= semiCount && tabCount >= commaCount && tabCount > 0) sep = '\t';
      else if (commaCount > semiCount) sep = ',';

      const parseLine = (line) => {
        const cols = [];
        let cur = '';
        let quoted = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (quoted && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              quoted = !quoted;
            }
          } else if (ch === sep && !quoted) {
            cols.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        cols.push(cur.trim());
        return cols;
      };

      const headerCells = parseLine(first).map(c => c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
      const hasHeader = headerCells.some(h => ['fecha', 'tipo', 'importe', 'categoria', 'cuenta', 'cuenta_origen', 'concepto', 'referencia', 'observaciones'].includes(h));
      const startIndex = hasHeader ? 1 : 0;

      const idxMap = {};
      if (hasHeader) {
        headerCells.forEach((h, i) => {
          if (h.includes('fecha')) idxMap.fecha = i;
          else if (h === 'tipo') idxMap.tipo = i;
          else if (h.includes('importe') || h.includes('eur') || h.includes('monto')) idxMap.importe = i;
          else if (h.includes('categ')) idxMap.categoria = i;
          else if (h.includes('cuenta')) idxMap.cuentaOrigen = i;
          else if (h.includes('concepto') || h.includes('descrip')) idxMap.concepto = i;
          else if (h.includes('ref')) idxMap.referencia = i;
          else if (h.includes('obs') || h.includes('nota')) idxMap.observaciones = i;
        });
      }

      const cleanCell = (v) => {
        const s = String(v ?? '').trim();
        return (!s || s.toUpperCase() === 'NULL') ? '' : s;
      };

      const items = [];
      for (let i = startIndex; i < lines.length; i++) {
        const cols = parseLine(lines[i]);
        if (!cols.length || cols.every(c => !cleanCell(c))) continue;

        let fecha, tipoRaw, importe, categoria, cuentaOrigen, concepto, referencia, observaciones;

        let rawCat = '';
        if (hasHeader && Object.keys(idxMap).length > 0) {
          fecha = parseCsvDate(idxMap.fecha !== undefined ? cols[idxMap.fecha] : '');
          tipoRaw = idxMap.tipo !== undefined ? cleanCell(cols[idxMap.tipo]) : '';
          importe = parseCsvAmount(idxMap.importe !== undefined ? cols[idxMap.importe] : 0);
          rawCat = idxMap.categoria !== undefined ? cleanCell(cols[idxMap.categoria]) : '';
          cuentaOrigen = (idxMap.cuentaOrigen !== undefined ? cleanCell(cols[idxMap.cuentaOrigen]) : '') || 'Cuenta Bancaria';
          concepto = (idxMap.concepto !== undefined ? cleanCell(cols[idxMap.concepto]) : '') || 'Movimiento CSV';
          referencia = idxMap.referencia !== undefined ? cleanCell(cols[idxMap.referencia]) : '';
          observaciones = idxMap.observaciones !== undefined ? cleanCell(cols[idxMap.observaciones]) : '';
        } else {
          fecha = parseCsvDate(cols[0] || '');
          tipoRaw = cleanCell(cols[1] || '');
          importe = parseCsvAmount(cols[2] || 0);
          rawCat = cleanCell(cols[3] || '');
          cuentaOrigen = cleanCell(cols[4] || '') || 'Cuenta Bancaria';
          concepto = cleanCell(cols[5] || '') || 'Movimiento CSV';
          referencia = cleanCell(cols[6] || '');
          observaciones = cleanCell(cols[7] || '');
        }

        const tLow = tipoRaw.toLowerCase();
        let tipo = defaultTipo;
        if (tLow.startsWith('ing')) tipo = 'INGRESO';
        else if (tLow.startsWith('gas')) tipo = 'GASTO';

        categoria = normalizeCategoriaInput(rawCat, tipo) || (tipo === 'INGRESO' ? 'Otros ingresos' : 'Otros gastos');

        if (importe > 0) {
          items.push({
            id: `csv-${Date.now()}-${i}-${Math.floor(Math.random() * 10000)}`,
            fecha,
            tipo,
            importe,
            categoria,
            cuentaOrigen,
            concepto,
            referencia,
            observaciones
          });
        }
      }
      return items;
    }

    function handleCsvFileSelected(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const ta = document.getElementById('csv-raw-textarea');
        if (ta) {
          ta.value = String(reader.result || '');
          updateCsvPreview();
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function updateCsvPreview() {
      const raw = document.getElementById('csv-raw-textarea')?.value || '';
      const defTipo = document.getElementById('csv-default-tipo')?.value || 'INGRESO';
      const summaryEl = document.getElementById('csv-preview-summary');
      if (!summaryEl) return;
      const parsed = parseMovimientosFromCsv(raw, defTipo);
      const total = parsed.reduce((s, x) => s + (Number(x.importe) || 0), 0);
      summaryEl.textContent = parsed.length > 0
        ? `${parsed.length} movimiento(s) listos para importar · Total: ${formatEur(total)}`
        : '0 filas válidas detectadas';
    }

    function confirmImportCsv() {
      const raw = document.getElementById('csv-raw-textarea')?.value || '';
      const defTipo = document.getElementById('csv-default-tipo')?.value || 'INGRESO';
      const parsed = parseMovimientosFromCsv(raw, defTipo);
      if (!parsed.length) {
        showToast('No se encontraron movimientos válidos en el CSV', 'error');
        return;
      }

      for (const mov of parsed) {
        if (mov.cuentaOrigen && !state.cuentas.some(c => c.nombre.toLowerCase() === mov.cuentaOrigen.toLowerCase())) {
          state.cuentas.push({
            id: `cta-${Date.now()}-${Math.floor(Math.random() * 100000)}`,
            nombre: mov.cuentaOrigen,
            tipo: 'Cuenta',
            saldoInicial: 0,
            notas: 'Creada automáticamente al importar CSV'
          });
        }
      }

      state.movimientos = [...parsed, ...state.movimientos];
      persistLocalState();
      closeModal();
      render();
      showToast(`Importados ${parsed.length} movimiento(s) desde CSV`, 'success');
    }

    // =========================================================================
    // PESTAÑA 3: INFORMES Y GRÁFICAS
    // =========================================================================
    function renderEvolucionMensualCard(movs) {
      const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      const monthMap = new Map();

      for (const m of movs) {
        const f = String(m.fecha || '').trim();
        const ym = /^\d{4}-\d{2}/.test(f) ? f.slice(0, 7) : 'Sin fecha';
        if (!monthMap.has(ym)) {
          monthMap.set(ym, { ym, ingresos: 0, gastos: 0 });
        }
        const entry = monthMap.get(ym);
        const imp = Number(m.importe) || 0;
        if (m.tipo === 'INGRESO') entry.ingresos += imp;
        else if (m.tipo === 'GASTO') entry.gastos += imp;
      }

      const series = Array.from(monthMap.values()).sort((a, b) => a.ym.localeCompare(b.ym));
      const maxVal = Math.max(...series.flatMap(s => [s.ingresos, s.gastos]), 1);

      const formatMonthLabel = (ym) => {
        const match = ym.match(/^(\d{4})-(\d{2})$/);
        if (!match) return ym;
        const mIdx = Number(match[2]) - 1;

    // =========================================================================
    // GENERACIÓN DE PDF CON jsPDF + autoTable, VISOR Y ENVÍO POR WHATSAPP
    // =========================================================================
    function buildInformePdfDocument() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });

      const movs = getFilteredReportMovimientos();
      const ingresosPer = movs.filter(m => m.tipo === 'INGRESO').reduce((s, m) => s + (Number(m.importe) || 0), 0);
      const gastosPer = movs.filter(m => m.tipo === 'GASTO').reduce((s, m) => s + (Number(m.importe) || 0), 0);
      const balancePer = ingresosPer - gastosPer;
      const rangoTxt = (state.ui.reportDesde || state.ui.reportHasta)
        ? `Período: ${state.ui.reportDesde ? formatDateEs(state.ui.reportDesde) : 'Inicio'} a ${state.ui.reportHasta ? formatDateEs(state.ui.reportHasta) : 'Hoy'}`
        : 'Período: Todos los movimientos registrados';

      doc.setFillColor(59, 10, 20);
      doc.rect(0, 0, 595, 72, 'F');
      doc.setTextColor(251, 191, 36);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      doc.text('ASOCIACIÓN SANTA ANA-98 · INFORME ECONÓMICO', 40, 34);

      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text(`${rangoTxt} · Emitido: ${new Date().toLocaleDateString('es-ES')}`, 40, 54);

      doc.autoTable({
        startY: 88,
        head: [['Total Ingresos', 'Total Gastos', 'Balance Neto']],
        body: [[formatEur(ingresosPer), formatEur(gastosPer), formatEur(balancePer)]],
        headStyles: { fillColor: [59, 10, 20], textColor: [251, 191, 36] },
        styles: { fontSize: 10, cellPadding: 8 }
      });

      const movRows = movs.map(m => [
        formatDateEs(m.fecha) || '',
        m.tipo || '',
        m.categoria || '',
        m.cuentaOrigen || '',
        m.concepto || '',
        `${m.tipo === 'INGRESO' ? '+' : '-'}${formatEur(m.importe)}`
      ]);

      doc.autoTable({
        startY: (doc.lastAutoTable?.finalY || 130) + 18,
        head: [['Fecha', 'Tipo', 'Categoría', 'Cuenta', 'Concepto', 'Importe']],
        body: movRows.length > 0 ? movRows : [['-', '-', '-', '-', 'Sin movimientos en el período', formatEur(0)]],
        headStyles: { fillColor: [83, 11, 27], textColor: [253, 230, 138] },
        styles: { fontSize: 8.5, cellPadding: 6 }
      });

      const filename = `Santa-Ana-98-Informe-${new Date().toISOString().slice(0, 10)}.pdf`;
      const summaryText = `*Asociación Santa Ana-98 · Informe Económico*\n${rangoTxt}\nIngresos: ${formatEur(ingresosPer)} · Gastos: ${formatEur(gastosPer)} · Balance: ${formatEur(balancePer)}`;

      return { doc, blob: doc.output('blob'), rangoTxt, filename, summaryText };
    }

    async function generateAndShowPdfReport() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast('No se cargó jsPDF en el navegador', 'error');
        return;
      }

      const { blob, rangoTxt, filename, summaryText } = buildInformePdfDocument();
      await openPdfInPopupWindow({
        title: `Informe PDF · ${filename}`,
        subtitle: rangoTxt,
        blob,
        filename,
        summaryText,
        onDownload: downloadGeneratedPdf
      });
    }

    function sendInformePdfViaWhatsApp() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast('No se cargó jsPDF en el navegador', 'error');
        return;
      }
      const { blob, filename, summaryText } = buildInformePdfDocument();
      lastGeneratedPdfBlob = blob;
      lastGeneratedPdfMeta = {
        filename,
        summaryText,
        downloadFn: downloadGeneratedPdf
      };
      downloadGeneratedPdf();
      openWhatsAppWithText(`${summaryText}\nArchivo PDF: ${filename}`);
      showToast('Informe PDF descargado · Abriendo WhatsApp', 'success');
    }

    function formatNumEsPlain(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('es-ES', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function getPartidaActualizadoEfectivo(p) {
      const previsto = Number(p?.importePrevisto) || 0;
      const tieneActualizado = p?.importeActualizado !== undefined && p?.importeActualizado !== null && p?.importeActualizado !== '';
      if (!tieneActualizado) return previsto;
      const actNum = Number(p.importeActualizado);
      if (!Number.isFinite(actNum)) return previsto;
      if (actNum === 0 && previsto !== 0) return previsto;
      return actNum;
    }

    function buildPresupuestoPdfDocument() {
      const presSel = (state.ui.prevPresupuestoActivo || 'TODAS').trim();
      const basePresList = (!presSel || presSel === 'TODAS')
        ? state.presupuestos
        : state.presupuestos.filter(p => getPartidaPresupuestoNombre(p).toLowerCase() === presSel.toLowerCase());
      const ingresosList = basePresList.filter(p => p.tipo === 'INGRESO');
      const gastosList = basePresList.filter(p => p.tipo === 'GASTO');

      const totalIngresosPrev = ingresosList.reduce((s, p) => s + (Number(p.importePrevisto) || 0), 0);
      const totalIngresosAct = ingresosList.reduce((s, p) => s + getPartidaActualizadoEfectivo(p), 0);

      const totalGastosEstimado = gastosList.reduce((s, p) => s + (Number(p.importePrevisto) || 0), 0);
      const totalGastosActualizado = gastosList.reduce((s, p) => s + getPartidaActualizadoEfectivo(p), 0);

      const presupuestoTotalRef = totalGastosActualizado > 0 ? totalGastosActualizado : totalGastosEstimado;
      const totalIngresosRef = totalIngresosAct > 0 ? totalIngresosAct : totalIngresosPrev;
      const remanenteCalculado = totalIngresosRef - presupuestoTotalRef;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'landscape' });
      const pageW = doc.internal.pageSize.getWidth();
      const margin = 24;
      const gap = 14;
      const leftW = Math.floor((pageW - margin * 2 - gap) * 0.36);
      const rightW = pageW - margin * 2 - gap - leftW;
      const rightX = margin + leftW + gap;

      doc.setFillColor(10, 10, 10);
      doc.rect(margin, 18, pageW - margin * 2, 26, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      const yearMatch = presSel.match(/(\d{4})/);
      const anioActual = yearMatch ? Number(yearMatch[1]) : new Date().getFullYear();
      const anioAnterior = anioActual - 1;
      const etiquetaCabecera = (presSel && presSel !== 'TODAS')
        ? presSel.toUpperCase()
        : `TODOS LOS PRESUPUESTOS`;
      const tituloPresupuesto = `${(state.meta?.asociacion || 'ASOCIACION SANTA ANA-98').toUpperCase()} PRESUPUESTO ${etiquetaCabecera}`;
      doc.text(tituloPresupuesto, pageW / 2, 35, { align: 'center' });

      const tableTopY = 54;

      const ingBodyRows = ingresosList.length > 0
        ? ingresosList.map(item => {
            const valShow = getPartidaActualizadoEfectivo(item);
            const conceptoTxt = `${(item.concepto || '').toUpperCase()}${item.notas ? ` (${item.notas})` : ''}`;
            return [formatNumEsPlain(valShow), conceptoTxt];
          })
        : [['0,00', 'SIN PARTIDAS DE INGRESO']];

      const totalIngShow = totalIngresosAct > 0 ? totalIngresosAct : totalIngresosPrev;
      ingBodyRows.push([formatNumEsPlain(totalIngShow), '']);

      doc.autoTable({
        startY: tableTopY,
        margin: { left: margin, right: pageW - (margin + leftW) },
        tableWidth: leftW,
        theme: 'grid',
        head: [
          [{ content: 'PRESUPUESTOS DE INGRESOS', colSpan: 2, styles: { fillColor: [10, 10, 10], textColor: [255, 255, 255], halign: 'center', fontStyle: 'bold', fontSize: 10, cellPadding: 7 } }],
          [
            { content: 'IMPORTES', styles: { fillColor: [255, 255, 255], textColor: [15, 15, 15], halign: 'center', fontStyle: 'bold', fontSize: 8.5 } },

    async function triggerCompatiblePdfDownload(blob, filename, successMsg) {
      if (!blob) return;
      const ua = navigator.userAgent || '';
      const isWebViewOrMobile = /Android|wv|WebView|iPhone|iPad|iPod/i.test(ua);

      // 1. En Android WebView / APK (WebIntoApp), los enlaces blob: abren "Save as" sin nombre o fallan.
      //    Web Share API con archivo o Data URI base64 evita el bloqueo de blob: en WebView.
      try {
        const pdfFile = new File([blob], filename, { type: 'application/pdf' });
        if (isWebViewOrMobile && navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
          await navigator.share({
            files: [pdfFile],
            title: filename
          });
          showToast(successMsg, 'success');
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }

      if (/Android|wv|WebView/i.test(ua)) {
        try {
          const reader = new FileReader();
          reader.onloadend = () => {
            const dataUrl = String(reader.result || '');
            if (!dataUrl) return;
            const link = document.createElement('a');
            link.href = dataUrl;
            link.setAttribute('download', filename);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(successMsg, 'success');
          };
          reader.readAsDataURL(blob);
          return;
        } catch (_) {}
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 2500);
      showToast(successMsg, 'success');
    }

    function downloadGeneratedPresupuestoPdf() {
      if (!lastGeneratedPdfBlob) {
        showToast('Primero genera el PDF del presupuesto', 'error');
        return;
      }
      const filename = `Santa-Ana-98-Presupuesto-${new Date().toISOString().slice(0, 10)}.pdf`;
      triggerCompatiblePdfDownload(lastGeneratedPdfBlob, filename, 'PDF de presupuesto descargado');
    }

    function downloadGeneratedPdf() {
      if (!lastGeneratedPdfBlob) {
        showToast('Primero genera el informe PDF', 'error');

      }
      const filename = `Santa-Ana-98-Informe-${new Date().toISOString().slice(0, 10)}.pdf`;
      triggerCompatiblePdfDownload(lastGeneratedPdfBlob, filename, 'PDF descargado');

    function getPartidaPresupuestoNombre(p) {
      const raw = String(p?.presupuesto ?? p?.evento ?? '').trim();
      return raw || 'Sin presupuesto asignado';
    }

    function getAllPresupuestosLabels() {
      const baseDefaults = ['Feria 2025', 'Feria 2026', 'Feria 2027', 'Feria 2028', 'Feria 2029'];
      const customList = Array.isArray(state.ui?.customPresupuestos) ? state.ui.customPresupuestos : [];
      const fromItems = state.presupuestos.map(p => getPartidaPresupuestoNombre(p));
      const deletedSet = new Set(
        (Array.isArray(state.ui?.deletedPresupuestos) ? state.ui.deletedPresupuestos : [])
          .map(x => String(x || '').trim().toLowerCase())
      );

      const mergedByLower = new Map();
      for (const candidate of [...baseDefaults, ...customList, ...fromItems]) {
        const clean = String(candidate || '').trim();
        if (!clean) continue;
        const low = clean.toLowerCase();
        const hasActiveItems = state.presupuestos.some(
          p => getPartidaPresupuestoNombre(p).toLowerCase() === low
        );
        if (!hasActiveItems && deletedSet.has(low)) continue;
        if (!mergedByLower.has(low)) {
          mergedByLower.set(low, clean);
        }
      }

      return Array.from(mergedByLower.values()).sort((a, b) => a.localeCompare(b, 'es'));
    }

    function confirmEliminarPresupuesto() {
      const target = (document.getElementById('del-pres-select')?.value || '').trim();
      if (!target) {
        showToast('Selecciona un presupuesto para eliminar', 'error');
        return;
      }
      const targetLow = target.toLowerCase();

      if (Array.isArray(state.ui.customPresupuestos)) {
        state.ui.customPresupuestos = state.ui.customPresupuestos.filter(x => String(x || '').trim().toLowerCase() !== targetLow);
      }

      if (!Array.isArray(state.ui.deletedPresupuestos)) {
        state.ui.deletedPresupuestos = [];
      }
      if (!state.ui.deletedPresupuestos.some(x => String(x || '').trim().toLowerCase() === targetLow)) {
        state.ui.deletedPresupuestos.push(target);
      }

      state.presupuestos = state.presupuestos.filter(p => getPartidaPresupuestoNombre(p).toLowerCase() !== targetLow);

      if ((state.ui.prevPresupuestoActivo || '').toLowerCase() === targetLow) {
        state.ui.prevPresupuestoActivo = 'TODAS';
      }

      persistLocalState();
      closeModal();
      render();
      showToast(`Presupuesto "${target}" eliminado`, 'success');
    }

      const bd = document.getElementById('modal-backdrop');
      bd.classList.add('hidden');

    function saveCuenta(editId) {
      const nombre = (document.getElementById('cta-nombre')?.value || '').trim();
      const tipo = (document.getElementById('cta-tipo')?.value || 'Cuenta').trim();
      const saldoInicial = Number(document.getElementById('cta-saldo')?.value) || 0;
      const fechaSaldo = (document.getElementById('cta-fecha-saldo')?.value || '').trim();
      const notas = (document.getElementById('cta-notas')?.value || '').trim();

      if (!nombre) {
        showToast('Indica un nombre de cuenta', 'error');
        return;
      }

      if (editId) {
        const cta = state.cuentas.find(x => x.id === editId);
        if (cta) {
          const oldName = cta.nombre;
          cta.nombre = nombre;
          cta.tipo = tipo;
          cta.saldoInicial = saldoInicial;
          cta.fechaSaldo = fechaSaldo;
          cta.notas = notas;
          if (oldName !== nombre) {
            state.movimientos.forEach(m => {
              if (m.cuentaOrigen === oldName) m.cuentaOrigen = nombre;
            });
          }
        }
      } else {
        state.cuentas.push({
          id: `cta-${Date.now()}`,
          nombre,
          tipo,
          saldoInicial,
          fechaSaldo,
          notas
        });
      }

      persistLocalState();
      closeModal();
      render();
      showToast('Cuenta guardada', 'success');
    }

    function deleteItemById(kind, id) {
      if (kind === 'cuenta') {
        const item = state.cuentas.find(x => x.id === id);
        if (!item) return;
        state.cuentas = state.cuentas.filter(x => x.id !== id);
        persistLocalState();
        render();
        showToast(`Cuenta eliminada: ${item.nombre}`, 'success');
      } else if (kind === 'movimiento') {
        const item = state.movimientos.find(x => x.id === id);
        if (!item) return;
        state.movimientos = state.movimientos.filter(x => x.id !== id);
        persistLocalState();
        render();
        showToast(`Movimiento eliminado: ${item.concepto}`, 'success');
      } else if (kind === 'presupuesto') {
        const item = state.presupuestos.find(x => x.id === id);
        if (!item) return;
        state.presupuestos = state.presupuestos.filter(x => x.id !== id);
        persistLocalState();
        render();
        showToast(`Partida eliminada: ${item.concepto}`, 'success');
      }
    }

    function savePresupuesto(editId) {
      const presupuesto = (document.getElementById('pre-presupuesto')?.value || '').trim();
      if (!presupuesto) {
        showToast('Indica el presupuesto o evento de la partida', 'error');
        return;
      }
      const tipo = (document.getElementById('pre-tipo')?.value || 'GASTO').trim();
      const concepto = (document.getElementById('pre-concepto')?.value || '').trim();
      const categoria = (document.getElementById('pre-cat')?.value || 'General').trim();
      const importePrevisto = Number(document.getElementById('pre-importe')?.value) || 0;
      const rawAct = (document.getElementById('pre-importe-actualizado')?.value || '').trim();
      const importeActualizado = rawAct === '' ? '' : (Number(rawAct) || 0);
      const notas = (document.getElementById('pre-notas')?.value || '').trim();

      if (!concepto) {
        showToast('Indica el concepto de la partida', 'error');
        return;
      }

      if (!Array.isArray(state.ui.customPresupuestos)) {
        state.ui.customPresupuestos = [];
      }
      if (Array.isArray(state.ui.deletedPresupuestos)) {
        state.ui.deletedPresupuestos = state.ui.deletedPresupuestos.filter(
          x => String(x || '').trim().toLowerCase() !== presupuesto.toLowerCase()
        );
      }
      if (!state.ui.customPresupuestos.some(x => x.toLowerCase() === presupuesto.toLowerCase())) {
        state.ui.customPresupuestos.push(presupuesto);
      }

      if (editId) {
        const item = state.presupuestos.find(x => x.id === editId);
        if (item) Object.assign(item, { presupuesto, tipo, concepto, categoria, importePrevisto, importeActualizado, notas });
      } else {
        state.presupuestos.push({
          id: `pre-${Date.now()}`,
          presupuesto,
          tipo,
          concepto,
          categoria,
          importePrevisto,
          importeActualizado,
          notas
        });
      }

      state.ui.prevPresupuestoActivo = presupuesto;
      persistLocalState();
      closeModal();
      render();
      showToast(`Partida guardada en ${presupuesto}`, 'success');
    }

    // =========================================================================
    // RENDER PRINCIPAL E INICIALIZACIÓN
    // =========================================================================
    function render() {
      renderNavHighlight();
      const mainEl = document.getElementById('main-content');
      switch (state.ui.activeTab) {
        case 'movimientos':
          mainEl.innerHTML = renderMovimientosTab();
          break;
        case 'informes':
          mainEl.innerHTML = renderInformesTab();
          break;
        case 'previsiones':
          mainEl.innerHTML = renderPrevisionesTab();
          break;
        case 'cuentas':
        default:
          mainEl.innerHTML = renderCuentasTab();
          break;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await hydrateLocalState();
      render();
      if (navigator.onLine) {
        pullFromSupabase(true);
      }
    });

    window.addEventListener('online', () => {
      showToast('Conexión restaurada · Sincronizando...', 'success');
      if (isAutoSyncEnabled()) {
        pushToSupabase(true);
      } else {
        pullFromSupabase(true);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.onLine && !autoSyncTimer) {
        pullFromSupabase(true);
      }
    });
  </script>
</body>
</html>
